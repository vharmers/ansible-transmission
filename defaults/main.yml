---
#
# General
#

transmission_enable: true
transmission_cli: true
transmission_config_dir: /etc/transmission-daemon
transmission_user: debian-transmission
transmission_user_home_dir: /var/lib/transmission-daemon
transmission_group: debian-transmission
transmission_service: transmission-daemon

#
# Networking
#

transmission_utp_enable: true
transmission_port_forwarding_enable: false
transmission_encryption: prefer
transmission_encryption_options: [no-prefer, prefer, require]

#
# Bandwith control
#

# Limit download speed
transmission_speed_limit_down_enable: true
transmission_speed_limit_down: 5000

# Limit upload speed
transmission_speed_limit_up_enable: true
transmission_speed_limit_up: 1000

# Alternate speeds
transmission_alt_speed_enable: false
transmission_alt_speed_down: 50
transmission_alt_speed_up: 50

# Alternate speeds schedule
transmission_alt_speed_time_enable: false
transmission_alt_speed_time_begin: 540
transmission_alt_speed_time_day: "{{ transmission_alt_speed_time_day_options['AllDays'] }}"
transmission_alt_speed_time_day_options:
  Sunday: 1
  Monday: 2
  Tuesday: 4
  Wednesday: 8
  Thursday: 16
  Friday: 32
  Saturday: 64
  Weekdays: 62
  Weekends: 65
  AllDays: 127
transmission_alt_speed_time_end: 1020

# Torrent ratio limit
transmission_ratio_limit_enable: false
transmission_ratio_limit: 2

# Torrent download queue
transmission_download_queue_enable: true
transmission_download_queue_size: 5

# Torrent seeding queue
transmission_seed_queue_enable: false
transmission_seed_queue_size: 10

# Torrent seeding idle limit
transmission_idle_seeding_limit_enable: false
transmission_idle_seeding_limit: 30

# Torrent upload limits
transmission_upload_limit_enable: false
transmission_upload_limit: 100
transmission_upload_slots_per_torrent: 14

# Stalled torrents
transmission_queue_stalled_enable: true
transmission_queue_stalled_minutes: 30

#
# Storage
#

transmission_download_dir: "{{ transmission_user_home_dir }}/downloads"
transmission_incomplete_dir_enable: false
transmission_incomplete_dir: "{{ transmission_download_dir }}/incomplete"
transmission_rename_partial_files: true
transmission_scrape_paused_torrents_enable: true
transmission_preallocation: fast
transmission_preallocation_options: ['off', fast, full]
transmission_umask: "022"
transmission_prefetch_enable: true
transmission_cache_size_mb: 4
transmission_watch_dir_enable: false
transmission_watch_dir: "{{ transmission_user_home_dir }}/watch"

#
# Peers
#

transmission_pex_enable: true
transmission_lpd_enable: false
transmission_bind_address_ipv4: "0.0.0.0"
transmission_bind_address_ipv6: "::"
transmission_peer_congestion_algorithm: ""
transmission_peer_id_ttl_hours: 6
transmission_peer_limit_global: 200
transmission_peer_limit_per_torrent: 50
transmission_peer_port: 51413
transmission_peer_port_random_on_start: false
transmission_peer_port_random_high: 65535
transmission_peer_port_random_low: 49152
transmission_peer_socket_tos: default

#
# RPC
#

transmission_rpc_enable: true
transmission_rpc_bind_address: "0.0.0.0"
transmission_rpc_port: 9091
transmission_rpc_url: /transmission/

# Access control
transmission_rpc_host_whitelist_enable: true
transmission_rpc_host_whitelist: []
transmission_rpc_whitelist_enable: true
transmission_rpc_whitelist:
  - "127.0.0.1"

# Authentication
transmission_rpc_authentication_required: true
transmission_rpc_username: transmission
transmission_rpc_password: ""

#
# Scripting
#

transmission_script_torrent_done_enable: "{{ transmission_script_torrent_done_filename | length > 0 }}"
transmission_script_torrent_done_filename: ""

#
# Blacklist
#

transmission_blocklist_enable: "{{ transmission_blocklist_url | length > 0 }}"
transmission_blocklist_url: ""

#
# Logging
#

transmission_message_level: error
transmission_message_level_options: [none, error, info, debug]

#
# Misc
#

transmission_dht_enable: true
transmission_start_added_torrents: true
transmission_trash_original_torrent_files: false
